                                    <button 
                                        onClick={() => setLangDropdownOpen(!langDropdownOpen)}
                                        className="px-3.5 py-1.5 rounded-full bg-[#141414] hover:bg-[#2a2a2a] text-xs font-semibold flex items-center gap-2 border border-[#2a2a2a] text-neutral-200 transition-colors shadow-sm"
                                    >
                                        <span className="text-sm">🌐</span>
                                        <span className="font-mono">{lang}</span>
                                        <svg className="w-3 h-3 text-neutral-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </button>

                                    <AnimatePresence>
                                        {langDropdownOpen && (
                                            <motion.div 
                                                initial={{ opacity: 0, y: 10 }}
                                                animate={{ opacity: 1, y: 0 }}
                                                exit={{ opacity: 0, y: 10 }}
                                                className="absolute right-0 mt-2 w-36 bg-[#141414] border border-[#2a2a2a] rounded-2xl shadow-2xl py-2 z-50 overflow-hidden"
                                            >
                                                {languages.map(item => (
                                                    <button
                                                        key={item.code}
                                                        onClick={() => {
                                                            setLang(item.code);
                                                            setLangDropdownOpen(false);
                                                        }}
                                                        className={`w-full px-4 py-2 text-left text-xs font-medium flex items-center justify-between hover:bg-white hover:text-black transition-colors ${lang === item.code ? 'text-white font-bold bg-[#2a2a2a]' : 'text-neutral-400'}`}
                                                    >
                                                        <span>{item.name}</span>
                                                        <span className="text-[10px] font-mono">{item.code}</span>
                                                    </button>
                                                ))}
                                            </motion.div>
                                        )}
                                    </AnimatePresence>
                                </div>

                                <button 
                                    onClick={handleDownload}
                                    className="px-4 py-1.5 text-xs font-bold bg-white text-black hover:bg-neutral-200 transition-all rounded-full flex items-center gap-1.5 shadow-md"
                                >
                                    <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                                        <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-13.051-1.851"/>
                                    </svg>
                                    <span className="hidden sm:inline">Download</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 pt-28 md:pt-36">
                        {/* Hero Section */}
                        <section className="relative px-6 py-12 md:py-16 max-w-4xl mx-auto text-center">
                            <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 0.5 }}>
                                <span className="inline-flex items-center gap-2 px-3.5 py-1 text-xs font-semibold bg-[#141414] border border-[#2a2a2a] rounded-full text-neutral-300 mb-6">
                                    {t.heroBadge}
                                </span>
                                
                                <h1 className="text-3xl sm:text-5xl font-extrabold text-white tracking-tight leading-snug max-w-3xl mx-auto mb-6">
                                    {t.heroTitle}
                                </h1>

                                <p className="text-base sm:text-lg text-neutral-400 max-w-2xl mx-auto mb-10 leading-relaxed">
                                    {t.heroSub}
                                </p>

                                <div className="flex flex-col sm:flex-row items-center justify-center gap-4 mb-5">
                                    <button 
                                        onClick={handleDownload}
                                        className="w-full sm:w-auto px-8 py-4 bg-white text-black hover:bg-neutral-200 font-bold text-base rounded-2xl shadow-xl transition-all duration-200 flex items-center justify-center gap-3"
                                    >
                                        <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24">
                                            <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-13.051-1.851"/>
                                        </svg>
                                        <span>{t.downloadBtn}</span>
                                    </button>
                                </div>

                                <p className="text-xs text-neutral-500 font-medium">
                                    {t.systemReq}
                                </p>
                            </motion.div>
                        </section>

                        {/* Interactive Live Timer Demo */}
                        <section id="demo" className="px-4 md:px-6 py-12 max-w-3xl mx-auto">
                            <div className="text-center mb-8">
                                <h2 className="text-2xl font-bold text-white mb-2">{t.liveDemoTitle}</h2>
                                <p className="text-neutral-400 text-sm">{t.liveDemoSub}</p>
                            </div>

                            <div className="bg-[#141414] p-6 sm:p-10 rounded-3xl border border-[#2a2a2a] shadow-2xl relative">
                                {/* Color Swatches */}
                                <div className="flex items-center justify-center gap-3 mb-8">
                                    {themeColors.map(c => (
                                        <button
                                            key={c.id}
                                            onClick={() => setSelectedColor(c.value)}
                                            className={`w-6 h-6 rounded-full transition-all ${selectedColor === c.value ? 'ring-2 ring-white scale-125 ring-offset-2 ring-offset-[#141414]' : 'opacity-60 hover:opacity-100'}`}
                                            style={{ backgroundColor: c.value }}
                                        />
                                    ))}
                                </div>

                                <div className="flex flex-col md:flex-row items-center justify-center gap-8 md:gap-16">
                                    <div className="egg-shape w-40 h-56 bg-[#2a2a2a] shadow-2xl shrink-0 relative border border-neutral-700">
                                        <div 
                                            className="absolute bottom-0 w-full transition-all duration-300"
                                            style={{ height: `${fillPercent}%`, backgroundColor: selectedColor }}
                                        />
                                    </div>

                                    <div className="flex flex-col items-center md:items-start text-center md:text-left">
                                        <div className="font-mono text-6xl sm:text-7xl font-extrabold text-white tracking-tighter mb-4">
                                            {formatDemoTime(demoSecondsLeft)}
                                        </div>

                                        <div className="flex flex-wrap gap-2 mb-6">
                                            {[15, 25, 30, 50].map(m => (
                                                <button
                                                    key={m}
                                                    onClick={() => setPreset(m)}
                                                    className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all ${demoTotalSeconds === m * 60 ? 'bg-white text-black' : 'bg-[#2a2a2a] text-neutral-400 hover:text-white'}`}
                                                >
                                                    {m} min
                                                </button>
                                            ))}
                                        </div>

                                        <div className="flex items-center gap-4">
                                            <button 
                                                onClick={() => setDemoIsRunning(!demoIsRunning)}
                                                className={`px-8 py-3 rounded-full font-bold text-sm border-2 transition-all ${demoIsRunning ? 'border-neutral-500 text-neutral-300' : 'border-white text-white hover:bg-white hover:text-black'}`}
                                            >
                                                {demoIsRunning ? t.pauseBtn : t.startBtn}
                                            </button>
                                            <button 
                                                onClick={() => setPreset(30)}
                                                className="text-xs text-neutral-500 hover:text-neutral-300 underline font-medium"
                                            >
                                                {t.resetBtn}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* 6 Core Interfaces Showcase (실제 캡처 사진 적용 영역) */}
                        <section id="showcase" className="px-4 md:px-6 py-16 max-w-5xl mx-auto">
                            <div className="text-center mb-10">
                                <h2 className="text-3xl font-extrabold text-white mb-3">{t.showcaseTitle}</h2>
                                <p className="text-neutral-400 text-sm max-w-lg mx-auto">{t.showcaseSub}</p>
                            </div>

                            <div className="flex flex-wrap items-center justify-center gap-2 mb-8 border-b border-[#2a2a2a] pb-4">
                                {[
                                    { id: 'timer', label: t.tabEgg },
                                    { id: 'calendar', label: t.tabCalendar },
                                    { id: 'clock', label: t.tabClock },
                                    { id: 'stopwatch', label: t.tabStopwatch },
                                    { id: 'stats', label: t.tabStats },
                                    { id: 'group', label: t.tabGroup }
                                ].map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => setActiveTab(tab.id)}
                                        className={`px-4 py-2 rounded-xl text-sm font-semibold transition-all ${activeTab === tab.id ? 'bg-white text-black shadow-lg scale-105' : 'text-neutral-400 hover:text-white hover:bg-[#2a2a2a]'}`}
                                    >
                                        {tab.label}
                                    </button>
                                ))}
                            </div>

                            <div className="rounded-3xl bg-[#141416] border border-[#2a2a2a] app-window-shadow overflow-hidden min-h-[460px] flex flex-col">
                                <div className="bg-[#1a1a1e] px-5 py-3 border-b border-[#2a2a2a] flex items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <div className="w-3 h-3 rounded-full bg-[#ef4444]"></div>
                                        <div className="w-3 h-3 rounded-full bg-[#eab308]"></div>
                                        <div className="w-3 h-3 rounded-full bg-[#22c55e]"></div>
                                        <span className="ml-3 text-xs font-medium text-neutral-400">Focus Egg Timer</span>
                                    </div>
                                    <span className="text-xs font-mono text-neutral-500">v1.0.0</span>
                                </div>

                                <div className="flex-1 p-4 sm:p-8 flex items-center justify-center bg-[#18181b] relative overflow-hidden">
                                    <AnimatePresence mode="wait">
                                        <motion.div 
                                            key={activeTab}
                                            initial={{ opacity: 0, y: 10 }} 
                                            animate={{ opacity: 1, y: 0 }} 
                                            exit={{ opacity: 0, y: -10 }}
                                            transition={{ duration: 0.2 }}
                                            className="w-full flex items-center justify-center"
                                        >
                                            <img 
                                                src={screenshotImages[activeTab]} 
                                                alt={`Focus Egg Timer - ${activeTab}`} 
                                                className="max-w-full h-auto rounded-2xl shadow-2xl border border-neutral-700/60 object-contain max-h-[550px]"
                                            />
                                        </motion.div>
                                    </AnimatePresence>
                                </div>
                            </div>
                        </section>

                        {/* Features Breakdown */}
                        <section id="features" className="px-6 py-16 max-w-5xl mx-auto">
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                <div className="bg-[#141414] p-6 rounded-3xl border border-[#2a2a2a]">
                                    <h3 className="text-base font-bold text-white mb-2">{t.feat1Title}</h3>
                                    <p className="text-neutral-400 text-xs leading-relaxed">{t.feat1Desc}</p>
                                </div>
                                <div className="bg-[#141414] p-6 rounded-3xl border border-[#2a2a2a]">
                                    <h3 className="text-base font-bold text-white mb-2">{t.feat2Title}</h3>
                                    <p className="text-neutral-400 text-xs leading-relaxed">{t.feat2Desc}</p>
                                </div>
                                <div className="bg-[#141414] p-6 rounded-3xl border border-[#2a2a2a]">
                                    <h3 className="text-base font-bold text-white mb-2">{t.feat3Title}</h3>
                                    <p className="text-neutral-400 text-xs leading-relaxed">{t.feat3Desc}</p>
                                </div>
                                <div className="bg-[#141414] p-6 rounded-3xl border border-[#2a2a2a]">
                                    <h3 className="text-base font-bold text-white mb-2">{t.feat4Title}</h3>
                                    <p className="text-neutral-400 text-xs leading-relaxed">{t.feat4Desc}</p>
                                </div>
                                <div className="bg-[#141414] p-6 rounded-3xl border border-[#2a2a2a]">
                                    <h3 className="text-base font-bold text-white mb-2">{t.feat5Title}</h3>
                                    <p className="text-neutral-400 text-xs leading-relaxed">{t.feat5Desc}</p>
                                </div>
                                <div className="bg-[#141414] p-6 rounded-3xl border border-[#2a2a2a]">
                                    <h3 className="text-base font-bold text-white mb-2">{t.feat6Title}</h3>
                                    <p className="text-neutral-400 text-xs leading-relaxed">{t.feat6Desc}</p>
                                </div>
                            </div>
                        </section>

                        {/* Download CTA Section */}
                        <section className="px-6 py-16 max-w-3xl mx-auto text-center">
                            <div className="bg-[#141414] p-10 rounded-3xl border border-[#2a2a2a]">
                                <h2 className="text-2xl font-extrabold text-white mb-3">{t.downloadSectionTitle}</h2>
                                <p className="text-neutral-400 text-xs mb-6 max-w-md mx-auto">{t.downloadSectionSub}</p>
                                <button 
                                    onClick={handleDownload}
                                    className="px-8 py-4 bg-white text-black font-bold text-sm rounded-2xl shadow-xl hover:bg-neutral-200 transition-all inline-flex items-center gap-3"
                                >
                                    <svg className="w-4 h-4 fill-current" viewBox="0 0 24 24">
                                        <path d="M0 3.449L9.75 2.1v9.451H0m10.949-9.602L24 0v11.4H10.949M0 12.6h9.75v9.451L0 20.699M10.949 12.6H24V24l-13.051-1.851"/>
                                    </svg>
                                    <span>FocusEggTimer_v1.0_Setup.exe</span>
                                </button>
                            </div>
                        </section>
                    </main>

                    {/* Footer */}
                    <footer className="border-t border-[#2a2a2a] px-6 py-8 text-center text-xs text-neutral-500">
                        <div className="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
                            <span>{t.footerText}</span>
                            <span>© {new Date().getFullYear()} Focus Egg Timer. All rights reserved.</span>
                        </div>
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
